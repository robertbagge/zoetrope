[package]
name = "zoetrope-cli"
version = "0.5.0"
edition.workspace = true
description = "Convert screen recordings to GIF or animated WebP"
publish = false

[[bin]]
name = "zoetrope"
path = "src/main.rs"

[dependencies]
zoetrope-core = { path = "../zoetrope-core" }
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
gif = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
tempfile = "3"
